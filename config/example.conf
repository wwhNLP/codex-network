# 纯 KEY=VALUE 格式；不使用引号、变量展开或行尾注释。
# 建议运行 ./codex-network init dev，由向导创建 config/dev.conf。
SSH_HOST=my-server
LOCAL_PROXY_PORT=7897
REMOTE_PORT=17897
PROBE_URL=https://chatgpt.com/
MANAGE_TUNNEL=yes
# 可选：单独的 SSH 隧道别名，默认使用 SSH_HOST。
# TUNNEL_HOST=my-server-tunnel
# 可选：管理已经安装的 launchd 任务时指定；新用户无需填写。
# LAUNCH_LABEL=io.github.codex-network.dev
